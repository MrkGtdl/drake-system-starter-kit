services:
  postgres:
    image: postgres:17-alpine
    container_name: system-starter-kit-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: starter_admin
      POSTGRES_PASSWORD: local_dev_password_change_me
      POSTGRES_DB: system_starter_kit

    ports:
      - "5434:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U starter_admin -d system_starter_kit
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
